services:
  api:
    build: .
    env_file: .env
    environment:
      - DATA_DIR=/app/data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./sftp/incoming:/app/sftp-incoming
    restart: unless-stopped

  sftp:
    image: atmoz/sftp:alpine
    # The SFTP account is deliberately configurable; never ship a demo password.
    command: "${SFTP_USERNAME:?Set SFTP_USERNAME in .env}:${SFTP_PASSWORD:?Set SFTP_PASSWORD in .env}:1001:100:incoming"
    ports:
      - "127.0.0.1:2222:22"
    volumes:
      - ./sftp/incoming:/home/${SFTP_USERNAME:?Set SFTP_USERNAME in .env}/incoming
    restart: unless-stopped
